<svg xmlns="http://www.w3.org/2000/svg" width="1872" height="1090" viewBox="0 0 1872 1090"><rect x="0" y="0" width="1872" height="1090" fill="white"/><rect x="15" y="20" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="43" y="76.18" fill="#005A71" font-family="Times New Roman" font-size="46" font-weight="bold">Resources</text><text x="43" y="135.51999999999998" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">Student effort, bounded funding, partner access</text><text x="43" y="188.51999999999998" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">and independent clinical and privacy input</text><line x1="936" y1="216" x2="936" y2="264" stroke="#005A71" stroke-width="5"/><polygon points="936,264 920,240 952,240" fill="#005A71"/><rect x="15" y="275" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="43" y="331.18" fill="#005A71" font-family="Times New Roman" font-size="46" font-weight="bold">Activities</text><text x="43" y="390.52" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">Validate workflows, repair the core service,</text><text x="43" y="443.52" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">test inclusion and evaluate an existing platform</text><line x1="936" y1="471" x2="936" y2="519" stroke="#005A71" stroke-width="5"/><polygon points="936,519 920,495 952,495" fill="#005A71"/><rect x="15" y="530" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="43" y="586.18" fill="#005A71" font-family="Times New Roman" font-size="46" font-weight="bold">Outputs to verify</text><text x="43" y="645.52" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">Reliable records, clear save states, visit lists</text><text x="43" y="698.52" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">and auditable reminder or follow-up events</text><line x1="936" y1="726" x2="936" y2="774" stroke="#005A71" stroke-width="5"/><polygon points="936,774 920,750 952,750" fill="#005A71"/><rect x="15" y="785" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="43" y="841.18" fill="#005A71" font-family="Times New Roman" font-size="46" font-weight="bold">Outcomes to test</text><text x="43" y="900.52" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">Easier task completion and better follow-up visibility</text><text x="43" y="953.52" fill="#263238" font-family="Times New Roman" font-size="44" font-weight="normal">Clinical and attendance effects require later evaluation</text><text x="30" y="1081.54" fill="#263238" font-family="Times New Roman" font-size="38" font-weight="normal">Dependencies: staff capacity, consent, connectivity and an approved care pathway</text></svg>