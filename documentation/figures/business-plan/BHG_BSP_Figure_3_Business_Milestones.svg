<svg xmlns="http://www.w3.org/2000/svg" width="1872" height="1060" viewBox="0 0 1872 1060"><rect x="0" y="0" width="1872" height="1060" fill="white"/><rect x="15" y="15" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="42" y="70.35" fill="#005A71" font-family="Times New Roman" font-size="45" font-weight="bold">Months 1 to 3   Validate and repair</text><text x="42" y="131.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Select a facility and compare existing platforms</text><text x="42" y="186.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Release only the feasibility stage funding</text><line x1="936" y1="211" x2="936" y2="259" stroke="#005A71" stroke-width="5"/><polygon points="936,259 920,235 952,235" fill="#005A71"/><rect x="15" y="270" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="42" y="325.35" fill="#005A71" font-family="Times New Roman" font-size="45" font-weight="bold">Months 4 to 6   Conditional first service cohort</text><text x="42" y="386.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Evaluate one facility before adding a second</text><text x="42" y="441.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Agree paid terms and test actual collections</text><line x1="936" y1="466" x2="936" y2="514" stroke="#005A71" stroke-width="5"/><polygon points="936,514 920,490 952,490" fill="#005A71"/><rect x="15" y="525" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="42" y="580.35" fill="#005A71" font-family="Times New Roman" font-size="45" font-weight="bold">Months 7 to 9   Conditional cohort growth</text><text x="42" y="641.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Review first facilities before admitting others</text><text x="42" y="696.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Expand only within support and cash limits</text><line x1="936" y1="721" x2="936" y2="769" stroke="#005A71" stroke-width="5"/><polygon points="936,769 920,745 952,745" fill="#005A71"/><rect x="15" y="780" width="1842" height="190" fill="#EDF5F8" stroke="#005A71" stroke-width="3"/><text x="42" y="835.35" fill="#005A71" font-family="Times New Roman" font-size="45" font-weight="bold">Months 10 to 12   Renew or revise the model</text><text x="42" y="896.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Review retention, cost and independent findings</text><text x="42" y="951.86" fill="#263238" font-family="Times New Roman" font-size="42" font-weight="normal">Approve expansion, pivot or an orderly handover</text></svg>